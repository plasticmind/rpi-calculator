<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPI Financing Model · Class of 2031</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.460.0/dist/umd/lucide-react.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    const { useState, useMemo } = React;
    const { AlertTriangle, ChevronDown, ChevronUp, Home, Users } = lucideReact;

    const fmt = (n) => (isNaN(n) || n === null ? "\u2014" : `$${Math.round(n).toLocaleString("en-US")}`);
    const fmt0 = (n) => (isNaN(n) || n === null ? "\u2014" : Math.round(n).toLocaleString("en-US"));
    const pct = (n) => `${(n * 100).toFixed(1)}%`;

    const DEFAULTS = {
      tuition: 66300,
      fees: 1676,
      housing: 18870,
      books: 1410,
      archFees: 1175,
      personal: 1280,
      transportation: 540,
      programYears: 5,
      inflationRate: 4,
      atHomeStartYear: 3,
      atHomeEnabled: true,
      atHomeAnnualCost: 3600,
      leadership: 38000,
      grant: 17000,
      tap: 1000,
      fedLoansByYear: [
        { sub: 3500, unsub: 2000 },
        { sub: 4500, unsub: 2000 },
        { sub: 5500, unsub: 2000 },
        { sub: 5500, unsub: 2000 },
        { sub: 5500, unsub: 2000 },
      ],
      fedRate: 6.39,
      plusRate: 8.94,
      privateRate: 11.0,
      fedOrigination: 1.057,
      plusOrigination: 4.228,
      privateOrigination: 0,
      plusAnnualCap: 20000,
      plusLifetimeCap: 65000,
      ethanPaysUnsubInSchool: true,
      parentPaysPlusInSchool: false,
      parentPaysPrivateInSchool: false,
      repaymentYears: 10,
      handoffYearsPostGrad: 3,
      parentIncome: 140000,
      ethanStartingSalary: 58000,
      ethanSalaryGrowth: 4.5,
      targetMonthlyPayment: 1500,
    };

    const theme = {
      bg: "#F7F2E9",
      surface: "#FFFFFF",
      surfaceAlt: "#EFE8DB",
      ink: "#1C1714",
      inkSoft: "#5C5044",
      inkFaint: "#8A7E71",
      border: "#D9CFBE",
      accent: "#A8472C",
      accentDim: "#C88B6A",
      positive: "#4F6B3F",
      positiveDim: "#A8BB99",
      warn: "#7A2312",
      warnBg: "#F3DFD6",
      ethan: "#2F5D6E",
      ethanDim: "#8AA9B5",
      parent: "#A8472C",
      parentDim: "#C88B6A",
    };

    function monthlyPayment(principal, annualRate, years) {
      if (!principal || principal <= 0) return 0;
      const r = annualRate / 100 / 12;
      const n = years * 12;
      if (r === 0) return principal / n;
      return (principal * (r * Math.pow(1 + r, n))) / (Math.pow(1 + r, n) - 1);
    }

    function maxPrincipalForPayment(monthly, annualRate, years) {
      if (!monthly || monthly <= 0) return 0;
      const r = annualRate / 100 / 12;
      const n = years * 12;
      if (r === 0) return monthly * n;
      return (monthly * (Math.pow(1 + r, n) - 1)) / (r * Math.pow(1 + r, n));
    }

    const NumberInput = ({ value, onChange, prefix, suffix, step = 1, min, max, width = "7rem", disabled }) => (
      <div className="inline-flex items-center" style={{ background: theme.surface, border: `1px solid ${theme.border}`, borderRadius: 4, opacity: disabled ? 0.5 : 1 }}>
        {prefix && <span className="pl-2 pr-1 text-sm" style={{ color: theme.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{prefix}</span>}
        <input
          type="number"
          value={value}
          step={step}
          min={min}
          max={max}
          disabled={disabled}
          onChange={(e) => onChange(e.target.value === "" ? 0 : parseFloat(e.target.value))}
          className="py-1.5 bg-transparent outline-none text-sm"
          style={{ width, color: theme.ink, fontFamily: "'IBM Plex Mono', monospace", paddingLeft: prefix ? "0" : "0.5rem", paddingRight: suffix ? "0.25rem" : "0.5rem" }}
        />
        {suffix && <span className="pr-2 pl-1 text-sm" style={{ color: theme.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{suffix}</span>}
      </div>
    );

    const Section = ({ title, children, defaultOpen = false, subtitle }) => {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div style={{ borderTop: `1px solid ${theme.border}` }}>
          <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between py-4 text-left" style={{ color: theme.ink }}>
            <div>
              <div className="text-sm tracking-wide uppercase" style={{ color: theme.inkSoft, letterSpacing: "0.08em" }}>{title}</div>
              {subtitle && <div className="text-xs mt-1" style={{ color: theme.inkFaint }}>{subtitle}</div>}
            </div>
            {open ? <ChevronUp size={18} style={{ color: theme.inkSoft }} /> : <ChevronDown size={18} style={{ color: theme.inkSoft }} />}
          </button>
          {open && <div className="pb-6">{children}</div>}
        </div>
      );
    };

    const MetricCard = ({ label, value, sublabel, tone = "default" }) => {
      const color = tone === "positive" ? theme.positive : tone === "warn" ? theme.warn : theme.ink;
      return (
        <div className="p-5" style={{ background: theme.surface, border: `1px solid ${theme.border}` }}>
          <div className="text-xs uppercase tracking-wider mb-3" style={{ color: theme.inkSoft, letterSpacing: "0.1em" }}>{label}</div>
          <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 400, fontSize: "2rem", lineHeight: 1.05, color, letterSpacing: "-0.02em" }}>{value}</div>
          {sublabel && <div className="text-xs mt-2" style={{ color: theme.inkFaint, fontFamily: "'IBM Plex Mono', monospace" }}>{sublabel}</div>}
        </div>
      );
    };

    function RPICalculator() {
      const [s, setS] = useState(DEFAULTS);
      const set = (key) => (val) => setS((prev) => ({ ...prev, [key]: val }));
      const setFedLoan = (yearIdx, field) => (val) =>
        setS((prev) => {
          const next = [...prev.fedLoansByYear];
          next[yearIdx] = { ...next[yearIdx], [field]: val };
          return { ...prev, fedLoansByYear: next };
        });

      const yearBreakdown = useMemo(() => {
        let cumPlus = 0;
        const rows = [];
        for (let i = 0; i < s.programYears; i++) {
          const infl = Math.pow(1 + s.inflationRate / 100, i);
          const atHome = s.atHomeEnabled && i + 1 >= s.atHomeStartYear;
          const housingThisYear = atHome ? s.atHomeAnnualCost : s.housing * infl;
          const cost =
            s.tuition * infl + s.fees * infl + housingThisYear + s.books * infl +
            s.archFees * infl + s.personal * infl + s.transportation * infl;
          const grantAid = s.leadership + s.grant + s.tap;
          const fed = s.fedLoansByYear[i] || { sub: 0, unsub: 0 };
          const fedTotal = fed.sub + fed.unsub;
          const gapBeforePlus = cost - grantAid - fedTotal;
          const plusRemainingLifetime = Math.max(0, s.plusLifetimeCap - cumPlus);
          let plusGross = 0;
          if (gapBeforePlus > 0 && s.plusOrigination < 100) {
            plusGross = gapBeforePlus / (1 - s.plusOrigination / 100);
            plusGross = Math.min(plusGross, s.plusAnnualCap, plusRemainingLifetime);
          }
          const plusNet = plusGross * (1 - s.plusOrigination / 100);
          cumPlus += plusGross;
          const stillShort = Math.max(0, gapBeforePlus - plusNet);
          const privateGross = stillShort > 0 && s.privateOrigination < 100 ? stillShort / (1 - s.privateOrigination / 100) : 0;
          rows.push({ year: i + 1, atHome, cost, grantAid, fedSub: fed.sub, fedUnsub: fed.unsub, plusGross, plusNet, privateGross, gapBeforePlus });
        }
        return rows;
      }, [s]);

      const totals = useMemo(
        () => yearBreakdown.reduce((acc, y) => ({
          cost: acc.cost + y.cost, aid: acc.aid + y.grantAid, fedSub: acc.fedSub + y.fedSub,
          fedUnsub: acc.fedUnsub + y.fedUnsub, plus: acc.plus + y.plusGross, private: acc.private + y.privateGross,
        }), { cost: 0, aid: 0, fedSub: 0, fedUnsub: 0, plus: 0, private: 0 }),
        [yearBreakdown]
      );

      const inSchoolInterest = useMemo(() => {
        let ethanUnsub = 0, parentPlus = 0, parentPrivate = 0;
        let runningUnsub = 0, runningPlus = 0, runningPrivate = 0;
        yearBreakdown.forEach((y) => {
          runningUnsub += y.fedUnsub;
          runningPlus += y.plusGross;
          runningPrivate += y.privateGross;
          ethanUnsub += runningUnsub * (s.fedRate / 100);
          parentPlus += runningPlus * (s.plusRate / 100);
          parentPrivate += runningPrivate * (s.privateRate / 100);
        });
        return { ethanUnsub, parentPlus, parentPrivate };
      }, [yearBreakdown, s]);

      const balances = useMemo(() => {
        let fedSub = 0, fedUnsub = 0, plus = 0, priv = 0;
        yearBreakdown.forEach((y, i) => {
          const yrs = Math.max(0, s.programYears - i - 0.5);
          fedSub += y.fedSub;
          if (s.ethanPaysUnsubInSchool) fedUnsub += y.fedUnsub;
          else fedUnsub += y.fedUnsub * Math.pow(1 + s.fedRate / 100, yrs);
          if (s.parentPaysPlusInSchool) plus += y.plusGross;
          else plus += y.plusGross * Math.pow(1 + s.plusRate / 100, yrs);
          if (s.parentPaysPrivateInSchool) priv += y.privateGross;
          else priv += y.privateGross * Math.pow(1 + s.privateRate / 100, yrs);
        });
        return { fedSub, fedUnsub, plus, priv, total: fedSub + fedUnsub + plus + priv };
      }, [yearBreakdown, s]);

      const payments = useMemo(() => {
        const fedSub = monthlyPayment(balances.fedSub, s.fedRate, s.repaymentYears);
        const fedUnsub = monthlyPayment(balances.fedUnsub, s.fedRate, s.repaymentYears);
        const plus = monthlyPayment(balances.plus, s.plusRate, s.repaymentYears);
        const priv = monthlyPayment(balances.priv, s.privateRate, s.repaymentYears);
        return { fedSub, fedUnsub, plus, priv, ethan: fedSub + fedUnsub, parent: plus + priv, total: fedSub + fedUnsub + plus + priv };
      }, [balances, s]);

      const lifetimeInterest = useMemo(() => {
        const totalPaid = payments.total * s.repaymentYears * 12;
        const schoolInt =
          (s.ethanPaysUnsubInSchool ? inSchoolInterest.ethanUnsub : 0) +
          (s.parentPaysPlusInSchool ? inSchoolInterest.parentPlus : 0) +
          (s.parentPaysPrivateInSchool ? inSchoolInterest.parentPrivate : 0);
        return Math.max(0, totalPaid - balances.total) + schoolInt;
      }, [payments, balances, s, inSchoolInterest]);

      const affordability = useMemo(() => {
        const total = balances.total || 1;
        const weightedRate =
          (balances.fedSub * s.fedRate + balances.fedUnsub * s.fedRate +
           balances.plus * s.plusRate + balances.priv * s.privateRate) / total;
        const maxPrincipal = maxPrincipalForPayment(s.targetMonthlyPayment, weightedRate, s.repaymentYears);
        const shortfall = balances.total - maxPrincipal;
        return { weightedRate, maxPrincipal, shortfall };
      }, [balances, s]);

      const ethanIncomeAt = (yearsPostGrad) => s.ethanStartingSalary * Math.pow(1 + s.ethanSalaryGrowth / 100, yearsPostGrad);

      const phases = useMemo(() => {
        const h = Math.max(0, Math.min(s.handoffYearsPostGrad, s.repaymentYears));
        const afterHandoffYears = s.repaymentYears - h;
        const ethanAnnualInSchool = s.ethanPaysUnsubInSchool ? inSchoolInterest.ethanUnsub / s.programYears : 0;
        const parentAnnualInSchool =
          (s.parentPaysPlusInSchool ? inSchoolInterest.parentPlus / s.programYears : 0) +
          (s.parentPaysPrivateInSchool ? inSchoolInterest.parentPrivate / s.programYears : 0);
        return {
          school: {
            years: s.programYears,
            parentMonthly: parentAnnualInSchool / 12,
            ethanMonthly: ethanAnnualInSchool / 12,
            parentTotal: parentAnnualInSchool * s.programYears,
            ethanTotal: ethanAnnualInSchool * s.programYears,
          },
          preHandoff: {
            years: h,
            parentMonthly: payments.parent,
            ethanMonthly: payments.ethan,
            parentTotal: payments.parent * 12 * h,
            ethanTotal: payments.ethan * 12 * h,
          },
          postHandoff: {
            years: afterHandoffYears,
            parentMonthly: 0,
            ethanMonthly: payments.total,
            parentTotal: 0,
            ethanTotal: payments.total * 12 * afterHandoffYears,
          },
        };
      }, [s, payments, inSchoolInterest]);

      const lifetimeParentContribution = phases.school.parentTotal + phases.preHandoff.parentTotal + phases.postHandoff.parentTotal;
      const lifetimeEthanContribution = phases.school.ethanTotal + phases.preHandoff.ethanTotal + phases.postHandoff.ethanTotal;
      const lifetimeTotal = lifetimeParentContribution + lifetimeEthanContribution || 1;

      const plusCapHit = totals.plus >= s.plusLifetimeCap - 1;
      const needsPrivate = totals.private > 0;
      const maxLoanBar = Math.max(balances.fedSub, balances.fedUnsub, balances.plus, balances.priv, 1);

      return (
        <div style={{ background: theme.bg, minHeight: "100vh", color: theme.ink, fontFamily: "'IBM Plex Sans', -apple-system, sans-serif" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
            input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: ${theme.border}; border-radius: 2px; outline: none; }
            input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: ${theme.accent}; cursor: pointer; border: 3px solid ${theme.bg}; box-shadow: 0 0 0 1px ${theme.accent}; }
            input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: ${theme.accent}; cursor: pointer; border: 3px solid ${theme.bg}; box-shadow: 0 0 0 1px ${theme.accent}; }
            input[type="checkbox"] { accent-color: ${theme.accent}; }
          `}</style>

          <div className="max-w-6xl mx-auto px-6 py-10">
            <header className="mb-10">
              <div className="text-xs uppercase tracking-widest mb-3" style={{ color: theme.accent, letterSpacing: "0.15em" }}>
                RPI Financing Model &middot; Class of 2031
              </div>
              <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 400, fontSize: "2.5rem", lineHeight: 1.1, letterSpacing: "-0.02em", color: theme.ink }}>
                Architecture school, split between<br />parent and student.
              </h1>
              <p className="mt-4 max-w-2xl" style={{ color: theme.inkSoft, fontSize: "0.95rem", lineHeight: 1.6 }}>
                Costs inflate {s.inflationRate}%. Aid renews flat. After year {s.atHomeStartYear - 1}, housing cost drops to a food supplement.
                Ethan pays unsubsidized interest during school; defaults reflect a cash-strapped household.
              </p>
            </header>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
              <MetricCard label="5-Year Cost" value={fmt(totals.cost)} sublabel={`${s.inflationRate}% infl \u00b7 home Y${s.atHomeStartYear}+`} />
              <MetricCard label="Grant Aid" value={fmt(totals.aid)} sublabel={`${fmt(s.leadership + s.grant + s.tap)}/yr`} tone="positive" />
              <MetricCard label="Principal Borrowed" value={fmt(totals.fedSub + totals.fedUnsub + totals.plus + totals.private)} sublabel="at graduation" tone="warn" />
              <MetricCard label="Peak Family /mo" value={fmt(payments.total)} sublabel={`pre-handoff \u00b7 ${s.repaymentYears}-yr term`} tone="warn" />
            </div>

            {(plusCapHit || needsPrivate) && (
              <div className="p-5 mb-8 flex gap-4 items-start" style={{ background: theme.warnBg, border: `1px solid ${theme.accent}` }}>
                <AlertTriangle size={22} style={{ color: theme.warn, flexShrink: 0, marginTop: 2 }} />
                <div style={{ color: theme.warn }}>
                  <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "1.25rem", marginBottom: "0.5rem" }}>
                    {plusCapHit ? "PLUS lifetime cap reached" : "Financing gap beyond federal loans"}
                  </div>
                  <p className="text-sm" style={{ color: theme.ink, lineHeight: 1.6 }}>
                    Gap after federal loans is <strong>{fmt(totals.cost - totals.aid - totals.fedSub - totals.fedUnsub)}</strong>.
                    PLUS covers up to <strong>{fmt(s.plusLifetimeCap)}</strong>, leaving <strong>{fmt(Math.max(0, totals.cost - totals.aid - totals.fedSub - totals.fedUnsub - totals.plus))}</strong> in private loans.
                    The RPI Access Grant and Change of Family Circumstances Form are worth exploring.
                  </p>
                </div>
              </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 p-6 mb-8" style={{ background: theme.surfaceAlt, border: `1px solid ${theme.border}` }}>
              <div>
                <div className="text-xs uppercase tracking-wider mb-2" style={{ color: theme.inkSoft, letterSpacing: "0.1em" }}>Cost inflation</div>
                <NumberInput value={s.inflationRate} onChange={set("inflationRate")} suffix="%" step={0.1} width="5rem" />
              </div>
              <div>
                <div className="text-xs uppercase tracking-wider mb-2" style={{ color: theme.inkSoft, letterSpacing: "0.1em" }}>
                  <Home size={12} className="inline mr-1" /> Live at home
                </div>
                <label className="flex items-center gap-2 cursor-pointer mb-2">
                  <input type="checkbox" checked={s.atHomeEnabled} onChange={(e) => set("atHomeEnabled")(e.target.checked)} className="w-4 h-4" />
                  <span className="text-sm" style={{ color: theme.ink }}>Starting Y
                    <input type="number" min={2} max={5} value={s.atHomeStartYear} onChange={(e) => set("atHomeStartYear")(parseInt(e.target.value) || 3)} className="w-10 px-1 py-0.5 mx-1 text-center" style={{ background: theme.surface, border: `1px solid ${theme.border}`, borderRadius: 3, fontFamily: "'IBM Plex Mono', monospace" }} disabled={!s.atHomeEnabled} />
                  </span>
                </label>
                <div className="flex items-center gap-2">
                  <NumberInput value={s.atHomeAnnualCost} onChange={set("atHomeAnnualCost")} prefix="$" step={300} width="6rem" disabled={!s.atHomeEnabled} />
                  <span className="text-xs" style={{ color: theme.inkFaint }}>/yr food/misc</span>
                </div>
              </div>
              <div>
                <div className="text-xs uppercase tracking-wider mb-2" style={{ color: theme.inkSoft, letterSpacing: "0.1em" }}>Interest paid in school</div>
                <div className="space-y-1.5 text-sm">
                  <label className="flex items-center gap-2 cursor-pointer" style={{ color: theme.ink }}>
                    <input type="checkbox" checked={s.ethanPaysUnsubInSchool} onChange={(e) => set("ethanPaysUnsubInSchool")(e.target.checked)} className="w-3.5 h-3.5" />
                    <span>Ethan &rarr; unsub <span style={{ color: theme.inkFaint, fontSize: "0.75rem" }}>(~{fmt(inSchoolInterest.ethanUnsub / s.programYears)}/yr)</span></span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer" style={{ color: theme.ink }}>
                    <input type="checkbox" checked={s.parentPaysPlusInSchool} onChange={(e) => set("parentPaysPlusInSchool")(e.target.checked)} className="w-3.5 h-3.5" />
                    <span>Parents &rarr; PLUS <span style={{ color: theme.inkFaint, fontSize: "0.75rem" }}>(~{fmt(inSchoolInterest.parentPlus / s.programYears)}/yr)</span></span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer" style={{ color: theme.ink }}>
                    <input type="checkbox" checked={s.parentPaysPrivateInSchool} onChange={(e) => set("parentPaysPrivateInSchool")(e.target.checked)} className="w-3.5 h-3.5" />
                    <span>Parents &rarr; private <span style={{ color: theme.inkFaint, fontSize: "0.75rem" }}>(~{fmt(inSchoolInterest.parentPrivate / s.programYears)}/yr)</span></span>
                  </label>
                </div>
              </div>
            </div>

            <h2 className="mb-4" style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: "1.5rem", fontWeight: 400 }}>Year by year</h2>
            <div className="overflow-x-auto mb-10" style={{ background: theme.surface, border: `1px solid ${theme.border}` }}>
              <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                <thead>
                  <tr style={{ background: theme.surfaceAlt, borderBottom: `1px solid ${theme.border}` }}>
                    <th className="text-left py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.inkSoft }}>Year</th>
                    <th className="text-right py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.inkSoft }}>Cost</th>
                    <th className="text-right py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.positive }}>Grant</th>
                    <th className="text-right py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.inkSoft }}>Fed Sub</th>
                    <th className="text-right py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.inkSoft }}>Fed Unsub</th>
                    <th className="text-right py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.inkSoft }}>PLUS</th>
                    <th className="text-right py-3 px-4 font-normal text-xs uppercase tracking-wider" style={{ color: theme.warn }}>Private</th>
                  </tr>
                </thead>
                <tbody>
                  {yearBreakdown.map((y) => (
                    <tr key={y.year} style={{ borderBottom: `1px solid ${theme.border}` }}>
                      <td className="py-3 px-4" style={{ color: theme.ink, fontFamily: "'Fraunces', serif", fontSize: "1rem" }}>
                        {y.year}
                        {y.atHome && <span className="ml-2" style={{ fontSize: "0.7rem", color: theme.positive, fontFamily: "'IBM Plex Sans', sans-serif" }}>{"\u2302"} home</span>}
                      </td>
                      <td className="text-right py-3 px-4">{fmt(y.cost)}</td>
                      <td className="text-right py-3 px-4" style={{ color: theme.positive }}>{"\u2212"}{fmt0(y.grantAid)}</td>
                      <td className="text-right py-3 px-4">{fmt(y.fedSub)}</td>
                      <td className="text-right py-3 px-4">{fmt(y.fedUnsub)}</td>
                      <td className="text-right py-3 px-4">{fmt(y.plusGross)}</td>
                      <td className="text-right py-3 px-4" style={{ color: y.privateGross > 0 ? theme.warn : theme.inkFaint }}>{fmt(y.privateGross)}</td>
                    </tr>
                  ))}
                  <tr style={{ background: theme.surfaceAlt }}>
                    <td className="py-3 px-4 text-xs uppercase tracking-wider" style={{ color: theme.inkSoft }}>Total</td>
                    <td className="text-right py-3 px-4" style={{ fontWeight: 500 }}>{fmt(totals.cost)}</td>
                    <td className="text-right py-3 px-4" style={{ color: theme.positive, fontWeight: 500 }}>{"\u2212"}{fmt0(totals.aid)}</td>
                    <td className="text-right py-3 px-4" style={{ fontWeight: 500 }}>{fmt(totals.fedSub)}</td>
                    <td className="text-right py-3 px-4" style={{ fontWeight: 500 }}>{fmt(totals.fedUnsub)}</td>
                    <td className="text-right py-3 px-4" style={{ fontWeight: 500 }}>{fmt(totals.plus)}</td>

                    <div className="text-xs uppercase tracking-wider mb-3" style={{ color: theme.inkSoft }}>Origination fees</div>
                    <div className="space-y-2">
                      <div className="flex justify-between items-center"><span className="text-sm">Federal Direct</span><NumberInput value={s.fedOrigination} onChange={set("fedOrigination")} suffix="%" step={0.01} width="5rem" /></div>
                      <div className="flex justify-between items-center"><span className="text-sm">Parent PLUS</span><NumberInput value={s.plusOrigination} onChange={set("plusOrigination")} suffix="%" step={0.01} width="5rem" /></div>
                      <div className="flex justify-between items-center"><span className="text-sm">Private</span><NumberInput value={s.privateOrigination} onChange={set("privateOrigination")} suffix="%" step={0.01} width="5rem" /></div>
                    </div>
                  </div>
                </div>
              </Section>
              <Section title="PLUS loan limits">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="flex justify-between items-center"><span className="text-sm">Annual cap</span><NumberInput value={s.plusAnnualCap} onChange={set("plusAnnualCap")} prefix="$" step={1000} /></div>
                  <div className="flex justify-between items-center"><span className="text-sm">Lifetime cap</span><NumberInput value={s.plusLifetimeCap} onChange={set("plusLifetimeCap")} prefix="$" step={1000} /></div>
                </div>
              </Section>
            </div>

            <div className="mt-10 text-xs" style={{ color: theme.inkFaint, lineHeight: 1.6 }}>
              <p className="mb-2"><strong style={{ color: theme.inkSoft }}>Modeling notes:</strong></p>
              <ul className="space-y-1 list-disc pl-5">
                <li>PLUS and private loans legally stay with parents. "Handoff" = Ethan sending you the equivalent monthly amount. True transfer requires private refinance (strips federal protections).</li>
                <li>In-school interest approximated on running balance; actual accrues daily &mdash; within ~2% of real.</li>
                <li>At-home scenario drops dorm housing cost; transportation unchanged by default.</li>
                <li>Ethan's income uses exponential growth; real architecture careers have step jumps at licensure (Y3) and promotion (Y5&ndash;7).</li>
                <li>Affordability uses a blended rate across loan types; actual allocation could shift the real supported amount.</li>
                <li>This tool does math, not financial advice.</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RPICalculator />);
  </script>
</body>
</html>
